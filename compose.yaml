services:
  server:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    depends_on:
      - server
    command: http server:8000
    env_file:
      - .env
    ports:
      - "4040:4040"